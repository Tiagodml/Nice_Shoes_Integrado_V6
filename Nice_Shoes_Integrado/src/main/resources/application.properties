spring.application.name=nice-shoes
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nice_shoes?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:nice_shoes}
spring.datasource.password=${DB_PASSWORD:nice_shoes_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8080}

# Numeração e quantidade devem ser inteiros no JSON.
spring.jackson.deserialization.accept-float-as-int=false
